<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suliman Yousef | Portfolio 2025</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Work+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        scroll-behavior: smooth;
      }
      body {
        font-family: "Work Sans", "IBM Plex Sans Arabic", sans-serif;
        background: #000;
        overflow-x: hidden;
        color: white;
      }

      .glass {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(30px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transform-style: preserve-3d;
      }
      .dark .glass {
        background: rgba(0, 0, 0, 0.5);
      }
      .light body {
        background: #f0f4f8;
        color: #1e293b;
      }
      .light .glass {
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(59, 130, 246, 0.15);
        color: #1e293b;
      }
      .light h1,
      .light h2,
      .light h3 {
        color: #1e293b;
      }

      @keyframes marquee {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-50%);
        }
      }
      .animate-marquee {
        display: flex;
        width: max-content;
        animation: marquee 50s linear infinite;
      }
      .custom-scroll::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scroll::-webkit-scrollbar-thumb {
        background: #3b82f6;
        border-radius: 10px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0",
          "react-dom": "https://esm.sh/react-dom@18.2.0",
          "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
          "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
          "framer-motion": "https://esm.sh/framer-motion@10.16.4?external=react,react-dom",
          "three": "https://esm.sh/three@0.158.0",
          "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
          "react/": "https://esm.sh/react@^19.2.3/"
        }
      }
    </script>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="transition-all duration-700 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
