<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme") || "dark";
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suliman Yousef | Software Engineer & Full Stack Developer</title>

    />
    <meta
      name="keywords"
      content="Suliman Yousef, Software Engineer, Full Stack Developer, Laravel, React, Web Development, Saudi Arabia, Portfolio, Backend Developer, Frontend Developer"
    />
    <meta name="author" content="Suliman Yousef" />

    <!-- Open Graph / Facebook -->

    <meta property="og:url" content="https://suliman-yousef.vercel.app/" />

      property="og:title"

      property="og:description"

    <link rel="icon" type="image/png" href="/img/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Work+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        scroll-behavior: smooth;
      }
      body {
        font-family: "Work Sans", "IBM Plex Sans Arabic", sans-serif;
        overflow-x: hidden;
      }

      .glass {
        background: rgba(255, 255, 255, 0.05); /* Slightly visible in dark */
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      /* Light mode overrides */
      html:not(.dark) body {
        background: #f8fafc; /* slate-50 */
        color: #0f172a; /* slate-900 */
      }

      html.dark body {
        background: #020617; /* slate-950 */
        color: #f8fafc; /* slate-50 */
      }

      html:not(.dark) .glass {
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(0, 0, 0, 0.05);
        color: #0f172a;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1),
          0 2px 4px -2px rgb(0 0 0 / 0.1);
      }

      html:not(.dark) h1,
      html:not(.dark) h2,
      html:not(.dark) h3 {
        color: #0f172a;
      }

      @keyframes cert-marquee {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-50%);
        }
      }
      .animate-cert-marquee {
        display: flex;
        width: max-content;
        animation: cert-marquee 60s linear infinite;
      }
      .animate-marquee {
        display: flex;
        width: max-content;
        animation: marquee 50s linear infinite;
      }
      .custom-scroll::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scroll::-webkit-scrollbar-thumb {
        background: #3b82f6;
        border-radius: 10px;
      }
    </style>

    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="transition-all duration-700 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
